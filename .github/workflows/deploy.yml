name: Deploy to GitHub Pages

# main に push するたびにビルドして公開する。
# Actions タブから手動実行もできる。
on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN に Pages への配信権限を与える
permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1本だけ。実行中のものは走り切らせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json の engines は >=22.6。パーサーが型注釈付き .ts を直接実行するため
          node-version: 22
          cache: npm

      - run: npm ci

      # 型が通らないものは公開しない
      - run: npm run typecheck

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
